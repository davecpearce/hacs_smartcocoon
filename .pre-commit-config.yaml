---
repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.0
    hooks:
      - id: pyupgrade
        args: ["--py39-plus"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # Formatting handled by Ruff (ruff-format); Black removed to avoid conflicts
  - repo: https://github.com/pycqa/pylint
    rev: v4.0.6
    hooks:
      - id: pylint
        args:
          - --disable=import-error,unused-argument
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args:
          - --quiet
          - --format=custom
          - --configfile=tests/bandit.yaml
        additional_dependencies:
          - pbr
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
  # Security scanning hooks
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep
        entry: semgrep
        # `language: python` builds an isolated environment for semgrep from
        # additional_dependencies. `language: system` required it on PATH,
        # which meant installing it alongside homeassistant -- unsatisfiable,
        # since homeassistant pins PyJWT==2.10.1 and semgrep needs pyjwt~=2.13.
        language: python
        additional_dependencies: ["semgrep==1.172.0"]
        # Named rule packs rather than --config=auto, matching the CI job, so
        # a registry-side ruleset change cannot fail commits unexpectedly.
        args: [--config=p/python, --config=p/secrets, --severity=ERROR, --error]
        types: [python]
  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML]
        args: [--strict, --ignore-missing-imports, --explicit-package-bases]
