---
version: 2

# Each ecosystem below sets a `cooldown`, which delays adoption of freshly
# published versions. A compromised release is usually caught and yanked
# within days, so waiting is the cheapest protection available -- and it
# matters more here because patch and minor updates are auto-merged without a
# human looking at them.

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    # Raise pull requests for version updates
    # to github-actions against the `main` branch
    target-branch: "main"
    # github-actions supports only `default-days`; the semver-* keys are
    # rejected for this ecosystem.
    cooldown:
      default-days: 5
  - package-ecosystem: pip
    directory: "/.github/workflows"
    schedule:
      interval: daily
    # Raise pull requests for version updates
    # to github-actions against the `main` branch
    target-branch: "main"
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    # Raise pull requests for version updates
    # to github-actions against the `main` branch
    target-branch: "main"
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    # pytest-homeassistant-custom-component pins each of these to an exact
    # version, so bumping one on its own is unsatisfiable and the pull
    # request can never go green. They move when that package moves.
    # `homeassistant` was already listed here for the same reason.
    #
    # pylint, ruff and mypy are each pinned twice: here and as a `rev` in
    # .pre-commit-config.yaml. pre-commit is what gates CI, so a bump to
    # requirements_test.txt alone changes local behaviour and leaves CI on the
    # old version. Dependabot cannot see the second half of the pin, so every
    # proposal it makes for these is wrong -- and with auto-merge enabled a
    # minor bump lands unattended. mypy 2.1.0 -> 2.3.0 did exactly that.
    # Bump these by hand, in both files, in one commit.
    ignore:
      - dependency-name: "homeassistant"
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
      - dependency-name: "pytest-cov"
      - dependency-name: "pytest-timeout"
      - dependency-name: "pylint"
      - dependency-name: "ruff"
      - dependency-name: "mypy"
