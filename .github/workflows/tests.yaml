---
name: CI/CD Pipeline

# Deliberately no `schedule:` trigger here. GitHub disables scheduled
# workflows after 60 days of repository inactivity, and that is exactly what
# happened to this file: CI was silently switched off on 2026-05-27 and
# nobody noticed for ten weeks, because a disabled workflow reports nothing
# rather than failing. Pull requests merged against checks that were months
# stale.
#
# The nightly run still exists -- nightly.yml holds the schedule and calls
# this workflow. If that one gets disabled the same way, the loss is a
# nightly re-scan rather than all pull request validation.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_call:

env:
  DEFAULT_PYTHON: "3.13"

jobs:
  pre-commit:
    runs-on: "ubuntu-latest"
    name: Pre-commit
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install -e .
      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files --color=always

  test:
    runs-on: "ubuntu-latest"
    name: Test Python ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install -e .
      - name: Run tests with coverage
        run: |
          pytest --cov=custom_components.smartcocoon --cov-report=xml --cov-report=html
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-python-${{ matrix.python-version }}
          fail_ci_if_error: false

  security:
    runs-on: "ubuntu-latest"
    name: Security Scan
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Installed in isolation rather than into the project environment.
      # homeassistant pins PyJWT==2.10.1 while current semgrep requires
      # pyjwt~=2.13.0, so a shared solve is unsatisfiable -- and neither tool
      # needs the project's dependencies to do its job.
      - name: Install security tools
        run: |
          pipx install semgrep==1.172.0
          # pip-audit builds a throwaway venv to resolve requirements.txt, and
          # uses its own interpreter to do it. pipx would otherwise pick the
          # runner's system python (3.12), which cannot resolve pysmartcocoon
          # at all -- it requires >=3.13.2. Point it at the version set up above.
          pipx install --python "$(which python)" pip-audit==2.10.1
      - name: Run pip-audit dependency audit
        run: |
          echo "🔍 Running pip-audit dependency audit..."
          pip-audit --requirement requirements.txt --desc --format=json
      # `--config=auto` selects rule packs from the registry at run time, so
      # the ruleset changed underneath us and CI went red here with no code
      # change. Name the packs explicitly instead.
      #
      # This step never fails the build -- it only collects findings. The
      # gate is the next step, so that semgrep's full output (every severity)
      # reaches semgrep-results.json and the uploaded artifact, while only
      # ERROR-severity findings can actually block a merge.
      - name: Run semgrep security analysis
        run: |
          echo "🔍 Running semgrep security analysis..."
          semgrep \
            --config=p/python \
            --config=p/github-actions \
            --config=p/secrets \
            --json --output=semgrep-results.json . || true
      - name: Gate on ERROR-severity semgrep findings
        run: |
          python - <<'PY'
          import collections, json, pathlib, sys

          # The scan step swallows its exit code, so an outright semgrep
          # failure shows up here as a missing or unparseable file. Treat
          # that as a build failure rather than as "no findings".
          path = pathlib.Path("semgrep-results.json")
          if not path.exists():
              print("::error::semgrep produced no results file -- scan failed")
              sys.exit(1)
          try:
              results = json.loads(path.read_text()).get("results", [])
          except json.JSONDecodeError as exc:
              print(f"::error::semgrep results file is not valid JSON: {exc}")
              sys.exit(1)

          by_severity = collections.Counter(
              r["extra"]["severity"] for r in results
          )
          print(f"{len(results)} finding(s): {dict(by_severity) or 'none'}")

          blocking = [
              r for r in results if r["extra"]["severity"] == "ERROR"
          ]
          for r in results:
              marker = "BLOCKING" if r["extra"]["severity"] == "ERROR" else "advisory"
              print(
                  f"  [{marker}] {r['path']}:{r['start']['line']} "
                  f"{r['check_id']}"
              )

          if blocking:
              print(f"::error::{len(blocking)} ERROR-severity finding(s)")
              sys.exit(1)
          PY
      - name: Upload security scan results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-scan-results
          path: |
            semgrep-results.json
          retention-days: 30

  hacs:
    runs-on: "ubuntu-latest"
    name: HACS
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: "integration"
          ignore: brands

  hassfest:
    runs-on: "ubuntu-latest"
    name: Hassfest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master
